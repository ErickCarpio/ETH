# =============================================================================
# CONFIGURACIÓN DEL SISTEMA DE GRID TRADING CON ML
# =============================================================================

exchange:
  name: "binance"
  symbol: "ETH/USDT"
  
  # true = Usa las llaves de 'testnet_*' (0wovg...)
  # false = Usa las llaves de 'api_key' normales (zkWNn...)
  testnet: true
  
  # --- CREDENCIALES DE PRODUCCIÓN (Binance.com) ---
  api_key: ""TU_CLAVE_AQUI""
  secret: ""TU_CLAVE_AQUI""
  
  # --- CREDENCIALES DE TESTNET (testnet.binancefuture.com) ---
  # Llave "Ana Bot" de la imagen
  testnet_api_key: "TU_CLAVE_AQUI"
  testnet_secret: "TU_CLAVE_AQUI"

risk:
  total_capital: 1000.0
  grid_allocation: 0.80
  min_order_value: 20.0

data:
  window_years: 2
  timeframe: "4h"
  include_onchain: true
  include_sentiment: true

external_apis:
  # Tu API de CryptoPanic
  cryptopanic:
    enabled: true
    api_key: "TU_CLAVE_AQUI"
  
  # NewsAPI (El código limitará esto a 28 días automáticamente)
  newsapi:
    enabled: true
    api_key: "TU_CLAVE_AQUI"
  
  use_simulated_data: false

sentiment:
  min_confidence: 0.90
  keywords: ["ethereum", "ETH", "crypto"]
  lookback_days: 28  # Ajustado para evitar error 426
  aggregation_freq: "4H"

model:
  n_classes: 4
  optuna_trials: 1000
  quick_retrain_trials: 100
  model_dir: "./models"

grid:
  min_spacing: 0.005
  max_spacing: 0.03
  max_duration_hours: 72

dev:
  use_simulated_data: false
  paper_trading: true