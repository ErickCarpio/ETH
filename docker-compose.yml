version: '3'
services:
  questdb:
    image: questdb/questdb:latest
    container_name: questdb_eth_bot
    restart: always
    ports:
      - "9000:9000"  # API REST y Consola Web
      - "9009:9009"  # Influx Line Protocol (Alta velocidad)
      - "8812:8812"  # Postgres Wire Protocol
    volumes:
      - ./questdb_data:/root/.questdb  # Persistencia de datos en tu disco
    environment:
      - QDB_CAIRO_COMMIT_LAG=1000      # Commit cada 1s (equilibrio velocidad/seguridad)
      - QDB_CAIRO_MAX_UNCOMMITTED_ROWS=10000